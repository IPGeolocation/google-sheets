name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out the commit under test
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: Run formula tests
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          source "$HOME/.nvm/nvm.sh" --no-use
          nvm install "$NODE_MAJOR"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$NODE_MAJOR"
          node --version
          node --test test/Code.test.cjs
